[server]
host = "0.0.0.0"   # The host address to bind to
port = 8080        # Default port (can be overridden by flag/env)
basepath = "/"     # For the case of a reverse proxy
max_sync_upload_size = "2MB" # Threshold for switching from RAM to Disk processing
cors_allowed_origins = []

[server.processing]
n_ffmpeg_async = "auto"
n_ffmpeg_total = "auto"

[database]
# Driver: "sqlite" or "postgres"
driver = "sqlite"

# Source:
# For SQLite: Relative or absolute path to the .db file (e.g., "mediahub.db")
# For Postgres: Connection string (e.g., "postgres://user:pass@localhost:5432/mediahub?sslmode=disable")
source = "mediahub.db"

# Relevant only for Postgres connection pool
max_open_conns = 25
max_idle_conns = 25

[storage]
# Type: "local" or "s3"
type = "local"

[storage.local]
root = "storage_root"

[storage.s3]
endpoint = ""
region = ""
bucket = ""
access_key = ""
secret_key = ""
use_ssl = true

[logging]
level = "info" # Standard application logging level

[logging.audit]
type = "stdio" # Where to store audit logs: "stdio" or "database"
enabled = false # Toggle audit logging on or off
retention = "7d" # How long to keep audit logs (e.g., "7d" for 7 days)

[media]
# Optional: Path to the FFmpeg executable.
# If empty, the server will check the system PATH.
ffmpeg_path = ""

# Optional: Path to the FFprobe executable.
# If empty, the server will check near ffmpeg_path, then the system PATH.
ffprobe_path = ""

[auth.jwt]
# Token expiration settings
access_duration = "5min"
refresh_duration = "24h"

